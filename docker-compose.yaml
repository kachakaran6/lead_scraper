services:
  # ─────────────────────────────────────────────────────────────
  # Database
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ultimate_leads
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      coolify:
        aliases:
          - postgres
      leads-internal:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # Queue backend
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      coolify:
        aliases:
          - redis
      leads-internal:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # Search backend (self-hosted metasearch)
  # ─────────────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      BASE_URL: "http://localhost:8888/"
      LIMITER: "false"
    volumes:
      - ./infrastructure/searxng:/etc/searxng:rw
    networks:
      coolify:
        aliases:
          - searxng
      leads-internal:
        aliases:
          - searxng

  # ─────────────────────────────────────────────────────────────
  # API server
  # ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ultimate_leads
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SEARXNG_URL: http://searxng:8080
      NODE_ENV: production
      API_PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    networks:
      coolify:
        aliases:
          - api
          - leads-api
      leads-internal:
        aliases:
          - api
          - leads-api
    expose:
      - "4000"
    labels:
      - "caddy=https://leads-api.kachakaran.me, http://leads-api.kachakaran.me, https://leads-api.kachakaran.tech, http://leads-api.kachakaran.tech, http://leads-api.141.148.214.132.sslip.io"
      - "caddy.reverse_proxy={{upstreams 4000}}"
      - "caddy.networks=coolify"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────────
  # Background workers
  # ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ultimate_leads
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SEARXNG_URL: http://searxng:8080
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    networks:
      leads-internal:
        aliases:
          - worker

  # ─────────────────────────────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      coolify:
        aliases:
          - web
          - leads-web
      leads-internal:
        aliases:
          - web
          - leads-web
    expose:
      - "80"
    ports:
      - "5173:80"
    labels:
      - "caddy=https://leads.kachakaran.me, http://leads.kachakaran.me, https://leads.kachakaran.tech, http://leads.kachakaran.tech, http://leads.141.148.214.132.sslip.io, https://yizfpoejlnzcsh6saamilrty.kachakaran.me, http://yizfpoejlnzcsh6saamilrty.kachakaran.me"
      - "caddy.reverse_proxy={{upstreams 80}}"
      - "caddy.networks=coolify"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  coolify:
    name: coolify
    external: true
  leads-internal:
    name: leads-internal
    driver: bridge

# SearXNG configuration for Ultimate Lead Engine
use_default_settings: true

server:
  secret_key: "ultimate-leads-searxng-secret"
  limiter: false
  public_instance: false
  image_proxy: true
  method: "GET"
  default_http_headers: "X-Content-Type-Options: nosniff"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: go
    disabled: false
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: google news
    engine: google_news
    shortcut: gn
    disabled: true
  - name: google images
    engine: google_images
    shortcut: gi
    disabled: true

services:
  # ─────────────────────────────────────────────────────────────
  # Database
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ultimate-leads-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ultimate_leads
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # Queue backend
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ultimate-leads-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # Search backend (self-hosted metasearch)
  # ─────────────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: ultimate-leads-searxng
    environment:
      BASE_URL: "http://localhost:8888/"
      LIMITER: "false"
    ports:
      - "8888:8080"
    volumes:
      - ./infrastructure/searxng:/etc/searxng:rw
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # API server
  # ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ultimate-leads-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ultimate_leads
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      NODE_ENV: production
      API_PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # Background workers
  # ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ultimate-leads-worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ultimate_leads
      REDIS_URL: redis://redis:6379
      SEARXNG_URL: http://searxng:8080
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ultimate-leads-web
    depends_on:
      - api
    ports:
      - "5173:80"
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # Monitoring
  # ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ultimate-leads-prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ultimate-leads-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

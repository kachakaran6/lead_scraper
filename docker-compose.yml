services:
  # ─────────────────────────────────────────────────────────────
  # Database
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ultimate_leads
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      coolify:
        aliases:
          - postgres
      leads-internal:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # Queue backend
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      coolify:
        aliases:
          - redis
      leads-internal:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────
  # Search backend (self-hosted metasearch)
  # ─────────────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      BASE_URL: "http://localhost:8888/"
      LIMITER: "false"
    volumes:
      - ./infrastructure/searxng:/etc/searxng:rw
    networks:
      coolify:
        aliases:
          - searxng
      leads-internal:
        aliases:
          - searxng

  # ─────────────────────────────────────────────────────────────
  # API server
  # ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ultimate_leads
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SEARXNG_URL: http://searxng:8080
      NODE_ENV: production
      API_PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    networks:
      coolify:
        aliases:
          - api
          - leads-api
      leads-internal:
        aliases:
          - api
          - leads-api
    expose:
      - "4000"
    labels:
      - "caddy=https://leads-api.kachakaran.me, http://leads-api.kachakaran.me, https://leads-api.kachakaran.tech, http://leads-api.kachakaran.tech, http://leads-api.141.148.214.132.sslip.io"
      - "caddy.reverse_proxy={{upstreams 4000}}"
      - "caddy.networks=coolify"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────────────────────
  # Background workers
  # ─────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ultimate_leads
      REDIS_URL: redis://redis:6379
      SEARXNG_URL: http://searxng:8080
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    networks:
      leads-internal:
        aliases:
          - worker

  # ─────────────────────────────────────────────────────────────
  # Frontend
  # ─────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      coolify:
        aliases:
          - web
          - leads-web
      leads-internal:
        aliases:
          - web
          - leads-web
    expose:
      - "80"
    ports:
      - "5173:80"
    labels:
      - "caddy=https://leads.kachakaran.me, http://leads.kachakaran.me, https://leads.kachakaran.tech, http://leads.kachakaran.tech, http://leads.141.148.214.132.sslip.io, https://yizfpoejlnzcsh6saamilrty.kachakaran.me, http://yizfpoejlnzcsh6saamilrty.kachakaran.me"
      - "caddy.reverse_proxy={{upstreams 80}}"
      - "caddy.networks=coolify"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ─────────────────────────────────────────────────────────────
  # Admin Panel (Dedicated Authorization & User Control Plane)
  # ─────────────────────────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      coolify:
        aliases:
          - admin
          - leads-admin
      leads-internal:
        aliases:
          - admin
          - leads-admin
    expose:
      - "80"
    ports:
      - "5174:80"
    labels:
      - "caddy=https://leadsadmin.kachakaran.me, http://leadsadmin.kachakaran.me, https://leadsadmin.kachakaran.tech, http://leadsadmin.kachakaran.tech, http://leadsadmin.141.148.214.132.sslip.io"
      - "caddy.reverse_proxy={{upstreams 80}}"
      - "caddy.networks=coolify"
      - "caddy_0=https://leadsadmin.kachakaran.me"
      - "caddy_0.encode=zstd gzip"
      - "caddy_0.handle_path=/*"
      - "caddy_0.handle_path.0_reverse_proxy={{upstreams 80}}"
      - "caddy_0.header=-Server"
      - "caddy_0.try_files={path} /index.html /index.php"
      - "caddy_1=https://leadsadmin.kachakaran.tech"
      - "caddy_1.encode=zstd gzip"
      - "caddy_1.handle_path=/*"
      - "caddy_1.handle_path.1_reverse_proxy={{upstreams 80}}"
      - "caddy_1.header=-Server"
      - "caddy_1.try_files={path} /index.html /index.php"
      - "caddy_2=http://leadsadmin.141.148.214.132.sslip.io"
      - "caddy_2.encode=zstd gzip"
      - "caddy_2.handle_path=/*"
      - "caddy_2.handle_path.2_reverse_proxy={{upstreams 80}}"
      - "caddy_2.header=-Server"
      - "caddy_2.try_files={path} /index.html /index.php"
      - "caddy_ingress_network=coolify"
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.middlewares.gzip.compress=true"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.leadsadmin-http.entryPoints=http"
      - "traefik.http.routers.leadsadmin-http.middlewares=redirect-to-https"
      - "traefik.http.routers.leadsadmin-http.rule=Host(`leadsadmin.kachakaran.me`) || Host(`leadsadmin.kachakaran.tech`) || Host(`leadsadmin.141.148.214.132.sslip.io`)"
      - "traefik.http.routers.leadsadmin-http.service=leadsadmin-svc"
      - "traefik.http.routers.leadsadmin-https.entryPoints=https"
      - "traefik.http.routers.leadsadmin-https.middlewares=gzip"
      - "traefik.http.routers.leadsadmin-https.rule=Host(`leadsadmin.kachakaran.me`) || Host(`leadsadmin.kachakaran.tech`)"
      - "traefik.http.routers.leadsadmin-https.service=leadsadmin-svc"
      - "traefik.http.routers.leadsadmin-https.tls=true"
      - "traefik.http.routers.leadsadmin-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.leadsadmin-svc.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  coolify:
    name: coolify
    external: true
  leads-internal:
    name: leads-internal
    driver: bridge

<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultimate Leads — Autonomous Lead Intelligence & Scraping Platform</title>
    <meta name="description" content="Ultimate Business Data Intelligence, Universal Search, Automated Audits & CRM Pipeline Platform." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme-preference');
          // Default to dark if nothing stored or if legacy "system" value
          var isDark = stored === 'dark' || !stored || stored === 'system';
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-[var(--bg-base)] text-[var(--text-primary)] font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
